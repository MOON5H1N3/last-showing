{# The mark: a ticket stub with three bars, each shorter than the last (20 : 13 : 6). The bars and notches are cut
   out, so the background always shows through. Use it plainly: no rotation, outline, gradient or recolouring. #}
{% macro mark(height=24, label=None, uid='m') %}<svg class="mark" width="{{ (height * 1.6)|round|int }}" height="{{ height }}" viewBox="0 0 64 40" {% if label %}role="img" aria-label="{{ label }}"{% else %}aria-hidden="true"{% endif %}><defs><mask id="ls-cut-{{ uid }}"><rect width="64" height="40" rx="6" fill="#fff"/><circle cx="0" cy="20" r="6" fill="#000"/><circle cx="64" cy="20" r="6" fill="#000"/><rect x="18" y="10" width="7" height="20" rx="1" fill="#000"/><rect x="28.5" y="17" width="7" height="13" rx="1" fill="#000"/><rect x="39" y="24" width="7" height="6" rx="1" fill="#000"/></mask></defs><rect width="64" height="40" fill="currentColor" mask="url(#ls-cut-{{ uid }})"/></svg>{% endmacro %}
